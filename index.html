  <script>
    // --- 分野別の丁寧なポイント解説（グループ共通） ---
    const conceptGroups = {
      "S1-ics": { title: "📌 -ics で終わる学問名の単数扱い", e: "Physics（物理学）、Mathematics（数学）、Economics（経済学）などの学問名は、語尾に -s がついていても不可算名詞（単数扱い）となり、単数動詞（is / was）をとります。" },
      "S1-cor": { title: "📌 相関表現の主語と動詞の一致", e: "「either A or B」「neither A nor B」「not only A but also B」は、動詞に近い『B』に動詞を一致させます。逆に「B as well as A」は先頭の『B』に一致させるので注意しましょう！" },
      "S1-num": { title: "📌 a number of と the number of", e: "「a number of ＋複数名詞」は『たくさんの〜（＝many）』で複数扱い（are）、「the number of ＋複数名詞」は『〜の数』で単数扱い（is）になります。" },
      "S1-mod": { title: "📌 長い修飾語句に惑わされない主語の特定", e: "前置詞句・関係詞節・分詞・同格のカンマが主語の後ろに長く続いても、文の骨格となる「真の主語（One / The list / The committee など）」の単数・複数に動詞を一致させます。" },
      "S1-there": { title: "📌 There 構文の主語と動詞の一致", e: "「There ＋ V ＋ S」の構文では、動詞の後ろにある意味上の主語『S』の単数・複数に動詞（is/are, remain/remains など）を一致させます。" },
      "S2-so": { title: "📌 So / Neither ＋ V ＋ S（〜もそうだ／〜ない）", e: "肯定文に同意する「So ＋助動詞/be動詞＋主語」と、否定文に同意する「Neither [Nor] ＋助動詞/be動詞＋主語」は、必ず疑問文と同じ倒置語順になります。" },
      "S2-neg": { title: "📌 否定語句の文頭倒置", e: "Never before や Not until 〜、nor などの否定語句が節の先頭に立つと、その後ろは「助動詞/be動詞＋主語＋動詞」という疑問文の語順に倒置されます。" },
      "S2-cleft": { title: "📌 It is [was] 〜 that ... の強調構文", e: "強調したい語句（名詞・副詞句・when節など）を It is [was] と that の間に挟む構文です。副詞句や節を強調するときは which ではなく that を使います。" },
      "S2-q": { title: "📌 疑問詞の強調 on earth", e: "What / Why / How などの疑問詞の直後に「on earth（または in the world）」を置くと、『いったいぜんたい〜なのか』と疑問を強める働きをします。" },
      "S2-omit": { title: "📌 副詞節内の S + be の省略と if any / if ever", e: "接続詞 while や if の直後では「主節と同じ主語＋be動詞」が省略されて while doing や if not done になります。また「if any（もしあれば＝量）」「if ever（めったに〜ない＝頻度）」の区別も超重要です。" },
      "S3-non": { title: "📌 前文全体を受ける非制限用法の which", e: "「カンマ＋which」は、直前の名詞だけでなく『前の文の内容全体』を先行詞にとることができます（that や what は不可）。" },
      "S3-prep": { title: "📌 前置詞＋関係代名詞 (to which / in which / for which)", e: "自動詞＋前置詞（refer to, apply for）や場所・道具（in the museum, with the tools）を表す場合、前置詞を関係代名詞の前に置きます。前置詞の直後に that は置けません。" },
      "S3-whose": { title: "📌 所有格の関係代名詞 whose と of which", e: "先行詞が「物」であっても、直後に無冠詞の名詞が続く場合は所有格の whose（whose meaning）を使えます。名詞に the がつく場合は「of which ... the 名詞」となります。" },
      "S3-adv": { title: "📌 関係副詞 where / why と完全文・不完全文", e: "先行詞が場所でも後ろが「完全文」なら where、「不完全文（主語・目的語欠け）」なら which を使います。また「That's why ＋結果（そういうわけで）」も頻出です。" },
      "S3-chain": { title: "📌 連鎖関係代名詞（S + think / believe の挿入）", e: "関係代名詞の直後に「I think / I believe」が挿入されている場合、それをカッコに入れて取り除くと、後ろの動詞の主語となる主格の who が必要だと見抜けます。" },
      "S4-what": { title: "📌 先行詞を含む関係代名詞 what の重要構文", e: "「what S is/was（今の/昔のSの姿）」「what you call（いわゆる）」「A is to B what C is to D（AとBの関係はCとDと同じ）」は丸ごと覚えましょう。" },
      "S4-adj": { title: "📌 関係形容詞 what (what little 名詞 S + V)", e: "「what (little) ＋名詞＋ S + can [have]」で『（少ないながらも）Sができる［持っている］限りのすべての〜（なけなしの〜）』を表します。" },
      "S4-how": { title: "📌 However / No matter how ＋形容詞/副詞＋ S + V", e: "「どんなに〜でも」を表す譲歩構文では、直後に形容詞や副詞が来る場合、Whatever ではなく However または No matter how を使います。" },
      "S4-ever": { title: "📌 複合関係詞 whatever / whoever / whenever / wherever", e: "前置詞 to の後ろでも、後ろの節の中で主語になる場合は目的格 whomever ではなく主格の whoever を使います。" },
      "S5-that": { title: "📌 名詞節・同格の接続詞 that", e: "文頭で主語になる「That ＋完全文」や、抽象名詞の中身を説明する「The fact that ＋完全文」「There's no doubt that ＋完全文」では、関係代名詞ではなく接続詞 that を使います。" },
      "S5-so": { title: "📌 so 〜 that ... と such 〜 that ... の語順", e: "「so ＋形容詞/副詞＋ that」「so ＋形容詞＋ a ＋単数名詞＋ that」「such ＋ a ＋形容詞＋単数名詞＋ that」の語順を正確に区別しましょう。" },
      "S5-purp": { title: "📌 目的を表す so that S + can/could/would V", e: "「〜するために・〜できるように」という目的を表す副詞節には〈so that S + 助動詞 + V〉を用います。" },
      "S5-time": { title: "📌 時・比例・直後の接続詞 (Hardly / no sooner / every time)", e: "「Hardly had S + p.p. when/before 〜（〜するやいなや）」の文頭倒置や、「every time S + V（〜するたびに）」「It was 〜 before ...（〜するまでに…かかった）」が頻出です。" },
      "S5-imp": { title: "📌 命令文, and / or 〜 と群接続詞 in that", e: "「命令文, and 〜（そうすれば）」「命令文, or 〜（さもないと）」の対比と、前置詞の後ろに that を置く例外である群接続詞「in that 〜（〜という点で）」を押さえましょう。" },
      "S6-cond": { title: "📌 条件を表す接続詞 (unless / provided / supposing / as long as)", e: "「unless（〜しない限り）」「provided / supposing（もし〜ならば）」「on condition that（〜という条件で）」「as long as（〜しさえすれば＝条件）」は、副詞節内では未来も現在形で表します。" },
      "S6-case": { title: "📌 備えを表す in case S + (should) V", e: "「万一〜するといけないから・〜する場合に備えて」は群接続詞〈in case〉で表します。目的の so that との意味の違いに注意しましょう。" },
      "S6-conc": { title: "📌 譲歩の接続詞と倒置 (even though / even if / 形容詞 + as S + V)", e: "「Beautiful as she is（彼女は美しいけれども）」のように、補語の形容詞が文頭に出る譲歩の倒置構文や、文頭の主語節に使える Whether 〜 or not が狙われます。" },
      "S7-err": { title: "📌 誤文訂正・2空所補充・別空所の実戦演習", e: "主語と動詞の数の一致、文頭否定語による倒置、共通空所に入る関係詞・接続詞、相関接続詞ペア（neither...nor / so that...could）を総点検します。" },
      "V-inv": { title: "📌 Vintage 倒置・語順の特殊ルール", e: "否定語句（Never / Little / At no time / Not only / Only recently / Rarely / In no other 〜 / Not a word）や so / neither / nor が節頭に出ると疑問文語順に倒置します。また「so / as / too ＋形容詞＋ a ＋単数名詞」の語順も超頻出です。" },
      "V-cleft": { title: "📌 Vintage 強調構文・動詞の強調・省略", e: "「It is [was] 〜 that [who/whom] ...」の強調構文（特に It is not until A that B の形）、一般動詞の直前に置く強調の do / does / did、他動詞＋代名詞の語順（pick them up / give it up）、if not（〜でないとしても）などの省略を押さえましょう。" },
      "V-nar": { title: "📌 Vintage 話法の転換 (Direct ⇔ Indirect Speech)", e: "伝達動詞が過去（said / told / asked）のとき、時制の一致・代名詞・副詞の変換を行います。命令文は「tell O (not) to V」、提案の Let's は「suggest that S (should) 原形」、疑問文は「ask O if/wh節（平叙文語順）」に転換します。" }
    };

    // --- 全179問 完全網羅データ（PF850 123問 ＋ Vintage 56問） ---
    // 書式: ID|カテゴリ|タイプ|問題文|選択肢(^)区切り|正解(1-4)|個別解説|グループID|作問者の意図
    const rawData = `
F1-01|一致・数|c|物理は私の大好きな科目だ。\\nPhysics (   ) my favorite subject.|are^were^is^have been|3|「Physics（物理学）」「Mathematics（数学）」「Economics（経済学）」など -ics で終わる学問名は、語尾に -s がついていても不可算名詞（単数扱い）となり、単数動詞 is をとります。|S1-ics|語尾の -s に釣られて複数動詞 are / were を選ばせる典型的なひっかけ問題です。
F1-02|一致・数|c|数学は多くの生徒にとってとても難しい。\\nMathematics (   ) very difficult for many students.|are^be^is^were|3|Mathematics（数学）は -ics で終わる学問名なので単数扱いです。直後に many students がありますが、主語はあくまで Mathematics です。|S1-ics|-ics で終わる学科名が単数動詞 is をとる基本知識を問うています。
F1-03|一致・数|c|ビルか私のどちらかが議長に選ばれる予定だ。\\nEither Bill or I (   ) going to be elected chairman.|am^are^is^were|1|〈either A or B（AかBのどちらか）〉が主語になる場合、動詞は「B（動詞に近い方）」の人称・数に一致させます。ここでは B が I なので am が正解です。|S1-cor|Bill に合わせて is にしたり、2人だからと are にする誤りを狙っています。
F1-04|一致・数|c|ジェーンか私のどちらかが上司のためにレポートを清書しなければならない。\\nEither Jane or I (   ) to type up the report for our boss.|have^has^must^will|1|〈either A or B〉は B に動詞を一致させます。I に合わせて have を選びます。また空所直後に to があるため助動詞 must / will は不可です。|S1-cor|B（I）への動詞の一致と、〈have to V〉の語法を同時に見る良問です。
F1-05|一致・数|c|近くの大木に雷が落ちたとき，ナンシーも私たちの他の者も動じなかった。\\nNeither Nancy nor the rest of us (   ) when the big tree nearby was hit by lightning.|has upset^have upset^was upset^were upset|4|〈neither A nor B（AもBも〜ない）〉は動詞に近い B（the rest of us＝私たちの残り＝複数）に動詞を一致させるため、過去複数形の were upset が正解です。|S1-cor|Nancy に釣られて was upset を選ばせる罠と、〈be upset（動揺する）〉の語法を狙っています。
F1-06|一致・数|c|彼だけでなく私にも責任がある。\\nNot only he but also I (   ) to blame.|is^are^am^have|3|〈not only A but also B〉は強調の中心である B（I）に動詞を一致させるため am が正解です。〈be to blame〉で「責任がある」を表します。|S1-cor|同じ意味の〈B as well as A〉との語順・一致方向の違いを正確に区別できるかが狙いです。
F1-07|一致・数|c|兄弟だけでなくジョンにも責任がある。\\nJohn as well as his brothers (   ) to blame.|are^be^is^were|3|〈B as well as A（AだけでなくBも）〉が主語の場合、主語の核は先頭の B（John＝単数）なので、単数動詞 is を用います。|S1-cor|直前の複数名詞 his brothers に惑わされて are / were を選ぶ受験生をふるい落とす頻出問題です。
F1-08|一致・数|c|私だけでなく彼もアウトドアスポーツをするのが好きだ。\\nHe as well as I (   ) fond of playing outdoor sports.|is^am^has^have|1|〈He as well as I〉の主語の中心は先頭の He です。直前の I に釣られて am にせず、He に一致させて is を選びます。|S1-cor|空所の直前に I を置くことで、反射的に am を選ばせる絶妙なトラップです。
F1-09|一致・数|c|教室のいすのうちの1脚がこわれた。\\nOne of the chairs in the classroom (   ) broken.|have been^was^are^were|2|主語の核は先頭の One（1脚）なので単数扱いです。時制も過去なので単数動詞 was が正解となります。|S1-mod|the chairs の複数形に引きずられて were を選ばせる基本かつ重要な一致問題です。
F1-10|一致・数|c|私が夏休み中に読んだ本のうちの1冊は，『風と共に去りぬ』だった。\\nOne of the books I read during the summer vacation (   ) Gone With the Wind.|are^have been^was^were|3|One of the books (that) I read during the summer vacation の中心主語は先頭の One です。したがって単数動詞 was をとります。|S1-mod|関係詞節で主語を長くし、本来の主語 One を見失わせる作問テクニックです。
F1-11|一致・数|c|たくさんの科学者が来週の会議に出席する予定である。\\nA number of scientists (   ) going to attend the conference next week.|is^be^are^was|3|〈a number of ＋複数名詞〉は「たくさんの〜（＝many）」という意味で、複数扱い（動詞は are）になります。|S1-num|〈the number of 〜（〜の数＝単数扱い）〉との対比を問う、入試超頻出ペアの片方です。
F1-12|一致・数|c|クラスの生徒の数は15人に限られている。\\nThe number of students in the class (   ) limited to fifteen.|is^are^will^can|1|〈the number of ＋複数名詞〉は「〜の数」という意味で、主語の核は the number（単数）です。よって is が正解です。|S1-num|students に釣られて are を選ばせる問題。〈a number of〉との識別が最重要です。
F1-13|一致・数|c|負傷した人の数は，予想より多かった。\\nThe number of people who (   ) was greater than they had expected.|was injured^were injured^has been injured^have been injured|2|文全体の主語は The number（だから後ろは was greater）ですが、関係代名詞 who の先行詞は直前の people（複数）なので、who節内は過去複数形の were injured となります。|S1-num|The number の単数と、先行詞 people の複数の2段階の一致を同時に問うハイレベルな良問です。

F1-15|一致・数|c|彼の言語とさまざまな文化の知識は，彼の仕事にとても役立っている。\\nHis knowledge of languages and different cultures (   ) him a lot in his business.|are helping^are being helped^help^helps|4|of languages and different cultures は前置詞句（修飾語）であり、主語の核は His knowledge（不可算名詞＝単数扱い）なので、三人称単数現在の helps が正解です。|S1-mod|空所直前の複数名詞 languages and different cultures に目を奪われず、真の主語 knowledge を見抜く力を測っています。
F1-16|一致・数|c|これまでのところ科学者がクローンを作れる家畜動物のリストには，ヒツジ，ウシ，ヤギ，そして実験用のマウスが含まれる。\\nThe list of domesticated animals scientists have been able to clone so far (   ) sheep, cattle, goats and laboratory mice.|including^include^includes^to include|3|scientists have been able to clone so far は関係代名詞が省略された形容詞節で domesticated animals を修飾しています。文全体の主語は先頭の The list（単数）なので、本動詞は includes です。|S1-mod|関係詞の省略を見抜いた上で、複数名詞 animals や scientists に惑わされず The list に一致させる難関大らしい問題です。
F1-17|一致・数|c|その2か国間で育まれた友好関係は，条約を経て深められた。\\nThe friendly relationship experienced between the two countries (   ) deepened as a result of the treaty.|be^was^are^were|2|experienced between the two countries は過去分詞句で直前の The friendly relationship（単数）を修飾しています。主語は単数なので was が正解です。|S1-mod|experienced を過去形の動詞と誤認させたり、直前の the two countries に釣られて were を選ばせる罠です。
F1-18|一致・数|c|私がいつか訪れたい場所は，インドのタージマハルとアメリカ合衆国のグランドキャニオンである。\\nThe places I want to visit someday (   ) the Taj Mahal in India and the Grand Canyon in the USA.|are^be^is^will|1|I want to visit someday は The places を修飾する関係詞節です。主語の核は The places（複数）なので、複数動詞 are が正解です。|S1-mod|関係代名詞の目的格省略を見抜き、主語が複数（The places）であることを正確に把握できるかを問うています。

F1-29|倒置・強調・省略|c|「私はこれまでにここに来たことがありません」「そうなのですか？ 私も来たことがありません」\\n"I haven't been here before." "Is that so? (   )."|I haven't neither^Nor I haven't^I neither did^Neither have I|4|前文が I haven't been...（現在完了の否定）なので、助動詞 have を用いて〈Neither have I.〉と倒置します。Neither 自体に否定の意味が含まれるため、haven't にすると二重否定で誤りになります。|S2-so|前の時制・助動詞（have）を正しく引き継ぐことと、二重否定を避けることを狙っています。
F1-30|倒置・強調・省略|c|英単語のつづりは不変ではないし，一般的な合意以外のいかなる権威にも左右されない。\\nThe spelling of English words is not fixed, nor (   ) on any other authority than general agreement.|depends it^does it depend^it depends^it does depend|2|等位接続詞 nor（〜もない）が節の先頭に立つと、その後ろは疑問文と同じ語順（倒置）になります。一般動詞 depend なので助動詞 does を前に出して〈nor does it depend〉とします。|S2-neg|nor の直後が疑問文語順（助動詞＋S＋動詞の原形）になるという倒置の最重要ルールを問うています。

F2-024|関係詞|c|消防士たちは家々が火事になっている通りに到達するのに苦労した。\\nThe firemen had trouble getting to the street (   ) the houses were on fire.|how^that^where^which|3|先行詞が the street（場所）で、後ろの the houses were on fire が欠けのない完全な文（「その通りで家々が燃えていた＝on the street」）なので、関係副詞 where が正解です。|S3-adv|先行詞が場所でも後ろが不完全文なら which、完全文なら where という関係詞の鉄則を問うています。
F2-032|関係詞|c|スポーツの競技場にはよく特別なボックス席があるが，そこでは人々は飲食しながら試合を観戦することができる。\\nThere are often special box seats at sports stadiums, (   ) people can watch games with food and drinks.|where^wherever^which^whichever|1|カンマ＋where は「そしてそこでは（and there）」と先行詞（special box seats at sports stadiums）を補足説明します。後ろが SVO の完全文なので where が正解です。|S3-adv|カンマの後ろの文構造（people can watch games＝完全文）から、which ではなく関係副詞 where を選ばせる問題です。
F2-037|関係詞|c|彼は2週間入院している。そういうわけで，彼は今日来ることができない。\\nHe has been in the hospital for two weeks. That's (   ) he can't come today.|because^how^why^the way|3|先行詞 the reason が省略された関係副詞 why です。〈That's why ＋結果（そういうわけで〜だ）〉と〈That's because ＋原因（というのは〜だからだ）〉の対比が重要です。|S3-adv|前文が「原因（入院している）」で、空所以下が「結果（今日来られない）」なので、because ではなく why を選ぶ論理問題です。
F2-039|関係詞|c|私の友人のほとんどは，彼の絵が展示されている美術館へとすぐに行った。\\nMost of my friends immediately went to the museum (   ) his drawings were exhibited.|which^in which^to which^whose|2|「その美術館の中で彼の絵が展示されていた（his drawings were exhibited in the museum）」なので、前置詞 in を伴う〈in which〉（＝関係副詞 where）が正解です。|S3-prep|went to the museum の to に釣られて to which を選ばせる罠です。関係詞節内の動詞 were exhibited とのつながりを見るのがコツです。
F2-051|関係詞|c|これは，あなたの助けなしでは私がその意味を理解できなかったことわざだ。\\nThis is a proverb (   ) meaning I couldn't understand without your help.|that^what^which^whose|4|先行詞が「物（a proverb）」であっても、所有格の関係代名詞 whose を使って〈whose meaning（そのことわざの意味）〉と無冠詞の名詞を直後に続けることができます。|S3-whose|「whose は人だけに使う」という誤解を突き、物の先行詞に対しても whose が使えることを問うています。
F2-054|関係詞|c|きっと反対するだろうと私が思っていた男性からの反対意見はなかった。\\nThere was no objection from the man (   ) I thought was sure to protest.|of whom^on whom^who^by whom|3|節内の I thought は挿入節です。これを取り除くと〈the man who was sure to protest〉となり、was の主語となる「主格の関係代名詞 who」が必要だとわかります。|S3-chain|直後の I thought に惑わされて目的格 whom や前置詞＋whom を選ばせる、入試頻出の「挿入節トラップ」です。
F2-055|関係詞|c|これは私が生まれた家だ。\\nThis is the house (   ) I was born.|which^in which^in that^what|2|I was born in the house. の in the house が関係代名詞になった形なので〈in which〉（＝where）が正解です。前置詞の直後に that は置けません（in that は「〜という点で」という接続詞）。|S3-prep|完全文 I was born の前に which 単体は置けないこと、および in which と in that の違いを問うています。
F2-058|関係詞|c|彼は，私がその書名を思い出せないサリンジャーの小説の1冊について話した。\\nHe talked about one of Salinger's novels (   ) I can't remember the title.|which^whose^whatever^of which|4|I can't remember the title of the novel. の of the novel を関係代名詞にした形が〈of which〉です。後ろの名詞に定冠詞 the がついている（the title）ため、whose は使えず of which が正解です。|S3-whose|whose title（無冠詞）と of which ... the title（定冠詞つき）の決定的な違いを狙った難関大レベルの良問です。
F2-060|関係詞|c|ツアーに参加したい人は午前8時に駅前に集合しなければならない。\\n(   ) wish to join the tour must gather in front of the station at 8:00 a.m.|Anybody^Everybody^Those who^Whoever|3|「〜する人々」は〈those who ＋複数動詞〉で表します。直後の動詞が三単現の -s のない wish なので、単数扱いの Whoever（なら wishes になる）は不可で、Those who が正解です。|S3-chain|Whoever と Those who を並べ、直後の動詞が wish（複数形）であることから Those who を特定させる鋭い問題です。
F2-061|関係詞|c|あなたが子ども時代を過ごした家を覚えていますか。\\nDo you remember the house (   ) you spent your childhood years?|where^when^which^of which|1|spent の目的語は your childhood years（子ども時代）であり、you spent your childhood years (in the house) と SVO が揃った完全文なので、関係副詞 where が正解です。|S3-adv|「spend があるから目的語が欠けていて which だ！」と早合点する受験生を引っかける超有名トラップ問題です。
F2-063|関係詞|c|それが，彼らがその市へ引っ越せなくなった理由だった。\\nThat was the reason (   ) stopped them from moving to the city.|which^for^because^why|1|先行詞が the reason でも、後ろが stopped them... と主語が欠けた不完全文になっているため、関係副詞 why ではなく主格の関係代名詞 which（または that）が正解です。|S3-adv|「the reason を見たら無条件で why」と暗記している生徒を見事に撃沈させる、文法の本質を問う名問です。
F2-064|関係詞|c|彼は知らないふりをして，それで私はさらに腹が立った。\\nHe pretended ignorance, (   ) made me even angrier.|that^what^which^whichever|3|「彼が知らないふりをしたこと」という前文全体を受け、「そしてそのことが私をさらに怒らせた」と続ける非制限用法の〈, which〉です。|S3-non|カンマの後ろで前文全体を受ける関係代名詞 which と、第5文型〈make O C (even angrier)〉の組み合わせを問うています。
F2-068|関係詞|c|あなたが下すどんな決定も，社長の承認が必要です。\\nAny decision (   ) need the president's approval.|you make will^that will be^will be made^you will make|1|Any decision (that) you make が主語全体で、その後ろに本動詞の will need が続きます。「あなたが下す決定」という制限節内では未来のことでも現在形 make を使います。|S3-chain|関係代名詞の目的格省略を見抜き、節内の動詞 make と主節の助動詞 will の境界線を正確に把握できるかを試しています。
F2-075|関係詞|c|ジブリ美術館は私が訪れたい場所だ。\\nGhibli Museum is a place (   ) I want to visit.|where^to where^to which^which|4|先行詞が a place（場所）でも、後ろの visit は他動詞（「〜を訪れる」）で目的語が欠けているため、関係副詞 where ではなく目的格の関係代名詞 which が正解です。|S3-adv|「先行詞 a place ＝ where」という思い込みを突き、visit が他動詞であるため目的格の which になる点を見抜かせます。
F2-076|関係詞|c|これは私たちが勉強したキャンパスです。その隣が，あなたが見たがっていたお寺です。\\nThis is the campus where we studied. Next to it is the temple (   ) you wanted to see.|that^what^whatever^whose|1|第2文は Next to it（副詞句）＋ is（V）＋ the temple（S）という第1文型の倒置文で、the temple を目的格の関係代名詞 which（または that）が修飾しています。|S3-chain|〈Next to it is the temple〉という倒置の語順と、see の目的語となる関係代名詞 which / that の接続を同時に問うています。
F2-079|関係詞|c|それはナガノ氏が応募していた職だが，最終決定はまだなされていない。\\nThat is the position for (   ) Mr. Nagano has applied, but a final decision has not yet been made.|whom^which^that^what|2|「〜（職など）に応募する」は〈apply for the position〉です。前置詞 for が関係代名詞の前に出ているため、物の先行詞を受ける which を選びます（for that は不可）。|S3-prep|〈apply for 〜〉の熟語知識と、前置詞の直後には that や what は置けず which を置くという原則を問う早稲田大の問題です。
F2-090|関係詞|c|日本では，人々はよく集団行動をとるが，このことを最もはっきり示すのは日本人が旅行するそのしかただ。\\nIn Japan, people often perform activities in groups, and nothing shows this more clearly than the way (   ) Japanese people travel.|that^which^in which^how|3|「〜する方法・やり方」は〈the way (that) S V〉または〈the way in which S V〉で表します（the way how と2つ並べるのは現代英語では不可）。|S3-prep|the way in which（または the way that）の語法と、〈nothing V 比較級 than A（Aほど〜なものはない）〉の最上級表現も同時に問う名問です。
F2-091|関係詞|c|彼はそこで私を見たと言ったが，それはうそだった。\\nHe said that he saw me there, (   ) was a lie.|that^which^what^such|2|「彼がそこで私を見たと言ったこと」という前の文全体を先行詞にとる非制限用法の〈, which〉です。|S3-non|接続詞の that（said that...）と、非制限用法の関係代名詞 which（, which was a lie）の役割の違いを整理させます。
F2-098|関係詞|c|私は先週ひいた風邪がまだ治っていない。\\nI still haven't recovered from the cold (   ) last week.|what I caught^I caught^in which I caught^why I caught|2|「風邪をひく」は〈catch a cold〉なので、caught の目的語が欠けています。目的格の関係代名詞 which / that が省略された〈the cold I caught〉が正解です。|S3-chain|〈recover from A（Aから回復する）〉と〈catch a cold（風邪をひく）〉の2つの語法と関係詞省略を組み合わせた実戦問題です。
F2-100|関係詞|c|その事故を引き起こしたいくつかの要因について話そう。\\nLet's talk about some factors (   ) caused the accident.|those^what^where^that|4|先行詞 some factors（いくつかの要因）を、主格の関係代名詞 that が修飾して「その事故を引き起こした要因」となります。|S3-chain|先行詞が有り、後ろに動詞 caused が続く基本構造から主格の that を素早く選ぶ問題です。
F2-106|関係詞|c|彼女は，あなたをとても助けてくれると私が信じる女性です。\\nShe is the woman (   ) I believe can help you a lot.|as^who^whom^which|2|I believe は挿入節です。これを取り除くと the woman ( ___ ) can help you a lot となり、助動詞 can の主語が欠けているため、主格の who が正解です。|S3-chain|直後の I believe の目的語だと勘違いして whom を選ばせる、入試で最も差がつく挿入節問題です。
F2-114|関係詞|c|娘さんが弁護士になった先生のことを覚えていますか。\\nDo you remember the teacher (   ) daughter became an attorney?|so that^that his^which^whose|4|先行詞 the teacher と直後の無冠詞の名詞 daughter の間に「その先生の娘（his/her daughter）」という所有関係があるため、所有格の whose を用います。|S3-whose|空所の直後に無冠詞の単数可算名詞（daughter）が来ていることから、即座に所有格 whose を見抜く力を測っています。
F2-121|関係詞|c|チャーリー・チャップリンは無声映画での彼の業績で最もよく知られた俳優だった。\\nCharlie Chaplin was an actor (   ) was best known for his work in silent movies.|who^which^whose^what|1|先行詞が an actor（人）で直後に動詞 was が続くため、主格の関係代名詞 who が正解です。〈be best known for 〜〉で「〜で最もよく知られている」を表します。|S3-chain|先行詞（人）＋主格の who と、熟語〈be known for A（業績・特徴で知られる）〉の定着を確認しています。
F2-123|関係詞|c|意味をよく理解していない単語を使ってはいけません。\\nYou must not use the words (   ) meanings you don't understand well.|that^who^whose^which|3|you don't understand their meanings well の their meanings（それらの単語の意味）が〈whose meanings〉となって関係詞節の先頭に出た形です。|S3-whose|〈whose ＋名詞〉が関係詞節の中で「主語」だけでなく「understand の目的語」としても働くことを見抜けるかが狙いです。
F2-127|what・複合関係詞|c|よくあることだが，ジョンは会議に遅刻した。\\n(   ) is often the case, John was late for the meeting.|As^When^Since^Why|1|後続の主節全体（ジョンが会議に遅刻したこと）を先行詞にとり、文頭に置くことができるのは関係代名詞 As だけです（which は前文しか受けられず文頭には置けません）。|S4-what|主節の前に置かれて主節全体を受ける関係代名詞 As の特徴と慣用句〈As is often the case〉を狙っています。
F2-130|what・複合関係詞|c|ベル氏は私が情報を得た人物だ。\\nMr. Bell is the person (   ) I obtained the information.|for what^from whom^with whose^to who|2|「その人物から情報を得た（I obtained the information from the person）」なので、前置詞 from ＋目的格 whom の〈from whom〉が正解です。|S4-ever|動詞 obtain と結びつく前置詞 from と、前置詞の後ろでは who ではなく目的格 whom を使う規則を問うています。
F2-133|what・複合関係詞|c|この前の冬に私は香港に行ったが，そこは私が思っていたほど暖かくなかった。\\nLast winter I went to Hong Kong, (   ) as warm as I had expected.|when wasn't^where it wasn't^where wasn't^which it wasn't|2|Hong Kong を受ける関係副詞〈, where（そしてそこでは）〉の後ろには完全な文が続くため、天候・気温を表す主語の it が必要となり〈where it wasn't〉が正解です。|S4-ever|where wasn't と主語 it を落としたり、which it wasn't と関係代名詞と代名詞を重複させる誤りを誘うセンター試験の名作です。
F2-002|what・複合関係詞|c|どんなに社長ががんばっても，会社は最近の不景気のせいで破産するのではないかと私は思う。\\nI'm afraid that (   ) hard the president may try, the company will go bankrupt owing to the recent economic recession.|however^whatever^whichever^whoever|1|直後に副詞 hard があるため、形容詞・副詞を伴って「どんなに〜しても」を表す複合関係副詞 however（＝no matter how）が正解です。|S4-how|空所直後に形容詞・副詞（hard）があるときは whatever ではなく however / no matter how を選ぶ鉄則を問うています。
F2-013|what・複合関係詞|c|どうぞお気軽にご連絡ください。喜んで私にできる手助けをさせていただきます。\\nPlease feel free to contact me. I'm willing to give you (   ) help I can.|that^which^whose^what|4|〈what ＋名詞＋ S + can [have]〉で「Sができる［持っている］限りの（すべての）〜」という意味を表す関係形容詞 what の重要構文です（I can の後ろには give が省略されています）。|S4-adj|直後に名詞 help があるため whose を選びたくなりますが、意味と構造（all the help that I can）から関係形容詞 what を見抜かせる難関大頻出問題です。
F2-025|what・複合関係詞|c|ささやかながら，あなたの家族のお役に立てることは何でもしたい。\\nI'd like to do (   ) little service I can do for your family.|that^what^which^whose|2|〈what (little) ＋名詞＋ S + V〉で「（少ないながらも）Sが〜できる限りのすべての名詞」を表す関係形容詞 what の慣用表現です。|S4-adj|〈what little ＋不可算名詞〉の形で「なけなしの・ささやかながら精一杯の〜」を表すイディオム知識を問うています。
F2-026|what・複合関係詞|c|事情は50年前とは大違いである。\\nThings are very different from (   ) they were fifty years ago.|that^what^which^however|2|〈what S is（現在のSの姿・状態）〉〈what S was/were（過去のSの姿・状態）〉は関係代名詞 what の超重要構文です。|S4-what|前置詞 from の目的語となり、かつ were の補語となる関係代名詞 what（過去の事情・状態）を狙っています。
F2-033|what・複合関係詞|c|彼が私を今日の私にしてくれた。\\nHe's made me (   ) I am today.|that^what^when^which|2|〈make O C〉の補語 C の位置に〈what I am today（現在の私の姿・人格）〉が入った形です。先行詞を含み am の補語となる what が正解です。|S4-what|〈what I am（今の私）〉という関係代名詞 what の代表構文を〈make O C〉の中で使えるかを試しています。
F2-034|what・複合関係詞|c|どんなに忙しくても，少なくとも6時間は眠るようにしなさい。\\n(   ) busy you are, never fail to sleep at least six hours.|However^Whoever^Whatever^Whenever|1|直後に形容詞 busy があるため、〈However ＋形容詞＋ S + V（どんなに〜でも）〉の語順を作る However が正解です。また〈never fail to V〉は「必ず〜せよ」という意味です。|S4-how|直後の形容詞 busy を修飾できるのは複合関係副詞 However だけである点と、語順（However busy you are）を狙っています。
F2-036|what・複合関係詞|c|お米とアジア人の関係は，小麦とヨーロッパ人の関係と同じであるとよく言われる。\\nIt is often said that rice is to Asians (   ) wheat is to Europeans.|how^that^what^which|3|〈A is to B what C is to D〉で「AとBの関係は、CとDの関係と同じだ」を表す重要構文です（what の代わりに as を使うこともあります）。|S4-what|入試頻出の比較・比例構文〈A is to B what C is to D〉の接続語 what と語順を正確に再現できるかを問うています。
F2-040|what・複合関係詞|c|どんなに健康に自信があっても，年に1度は健康診断を受けることがすすめられている。[Howeverパターン]\\n(   ) confident you are about your health, you are advised to have a medical check-up once a year.|However^Whatever^Whenever^Whoever|1|直後に形容詞 confident があるため、1語で「どんなに〜でも」を表す複合関係副詞〈However ＋形容詞＋ S + V〉となります（Step 16・40番／440番に対応）。|S4-how|直後の形容詞 confident の存在から、Whatever ではなく However を選ばせる問題です。
F2-102|what・複合関係詞|c|どんなに健康に自信があっても，年に1度は健康診断を受けることがすすめられている。[No matter howパターン]\\n(   ) confident you are about your health, you are advised to have a medical check-up once a year.|No matter how^No matter what^No matter when^No matter which|1|〈However ＋形容詞＋ S + V〉を3語で書き換えた〈No matter how ＋形容詞＋ S + V〉の形です（Step 16・102番／237番に対応）。|S4-how|No matter what と No matter how を並べ、直後の形容詞 confident から No matter how を選ばせる問題です。
F2-044|what・複合関係詞|c|ダイエットに関する新情報は私たちに，多くの人々が考えていることが誤りであることを示している。\\nNew information about diet shows us that (   ) many people think is incorrect.|what^how^why^when|1|shows us (O1) に続く O2 の名詞節を導くのが接続詞 that です。その that節の中で〈what many people think（多くの人が考えていること）〉が主語となり、is incorrect が述語になっています。|S4-what|that と what が連続する〈that [what many people think] is incorrect〉という二重の名詞節構造を見抜けるかを問うセンター試験の傑作問題です。
F2-056|what・複合関係詞|c|時にはどんなにつらく思えても，あなたの勉強をやり続けなさい。\\nKeep on with your studies, (   ) hard it sometimes seems.|however^no matter what^so^whatever|1|seems の補語であった形容詞 hard が however の直後に引き寄せられた〈however hard it sometimes seems（時にはどんなにつらく思えても）〉の構文です。|S4-how|it sometimes seems hard の補語 hard が前に出ている構造を理解し、however を選べるかを問うています。
F2-062|what・複合関係詞|c|彼は彼女が英語で言ったことがあまりわかっていなかったようだ。\\nIt seems that he did not understand (   ) she said in English well.|what^when^why^whatever|1|understand の目的語となり、かつ said の目的語にもなる先行詞を含む関係代名詞 what（彼女が言ったこと）が正解です。|S4-what|先行詞がなく、前後の動詞（understand と said）の両方の目的語を兼ねる what の基本機能を問うています。
F2-070|what・複合関係詞|c|人前で話さなければならなかったときはいつでも，私は恐れですくんだ。\\n(   ) I had to speak in front of people, I was frozen with fear.|Whereas^Whoever^Whether^Whenever|4|「〜するときはいつでも（＝every time / at any time when）」と時を表す副詞節を導く複合関係副詞 Whenever が正解です。|S4-ever|文脈と後ろの完全文から、時の複合関係副詞 Whenever を選ばせる問題です。
F2-074|what・複合関係詞|c|その学校は10年前とすっかり変わっている。\\nThe school is quite different from (   ) it was ten years ago.|which^that^as^what|4|〈what it was ＋過去の時〉で「過去のそれの姿・状態」を表します。前置詞 from の目的語かつ was の補語となる what が正解です。|S4-what|〈different from what S was〉の定番パターンを正確に使えるかを問うています。
F2-080|what・複合関係詞|c|私たちの市は，今は20年前とはすっかり変わっている。\\nOur city is now very different from (   ) it was twenty years ago.|why^which^that^what|4|「20年前の私たちの市の姿」を〈what it was twenty years ago〉で表します。先行詞を含む関係代名詞 what の重要表現です。|S4-what|be動詞 was の後ろに補語が欠けていることに着目し、先行詞を含む what を選ぶ問題です。
F2-082|what・複合関係詞|c|初めは簡単に思えたことが実は難しかったということはよくある。\\n(   ) seems easy at first often turns out to be difficult.|It^That^What^Which|3|〈What seems easy at first（最初は簡単に思えること）〉が文全体の主語になり、turns out to be difficult（実は難しいと判明する）が述語になっています。seems の主語が欠けているため What が正解です（That の後ろには完全文が必要）。|S4-what|文頭の名詞節で、直後にいきなり動詞 seems が来ている（＝主語が欠けている）ことから That ではなく What を選ばせる頻出問題です。
F2-083|what・複合関係詞|c|あなたが決めることなら何にでも私は賛成します。\\nI will agree with (   ) you decide.|any what^whatever^ever what^anything how|2|前置詞 with の目的語となり、「〜するものは何でも（＝anything that）」という名詞節を導く複合関係代名詞 whatever が正解です。|S4-ever|前置詞 with の後ろで名詞節を作り、decide の目的語となる whatever の用法を問うています。
F2-084|what・複合関係詞|c|トムは持っていた少ないながらもすべてのお金を失った。\\nTom lost (   ) little money he had.|whose^which^what^how|3|関係形容詞 what を用いた〈what little ＋不可算名詞＋ S + V〉で「少ないながらも持っていたすべての〜（なけなしの〜）」を表す超重要慣用表現です。|S4-adj|直後の little に釣られて how little（どれほど少ないか）を選ばせる巧妙な罠です。「なけなしの金」は what little money です。
F2-087|what・複合関係詞|c|私たちはどんなに速く走っても9時の電車には間に合わないのではないかと思います。\\nI'm afraid we won't be in time for the 9:00 train (   ) how fast we run.|even if^as far as^no matter^as long as|3|空所の直後に how fast we run があるため、〈no matter how ＋副詞＋ S + V（どんなに〜しても）〉を作る no matter が正解です。|S4-how|後ろの how fast と結合して譲歩の副詞節を作る no matter を選ばせる問題です。
F2-088|what・複合関係詞|c|その仕事がどんなに大変でも，私は全力を尽くします。\\nNo matter (   ) hard the task is, I'll do my best.|than^as^however^how|4|No matter の後ろには疑問詞（ここでは形容詞 hard を伴う how）を続けます。No matter however と重ねることはできません。|S4-how|No matter how と However を混同して No matter however と選んでしまうミスを狙っています。
F2-089|what・複合関係詞|c|彼はどこに行ってもちやほやされる。\\nHe is made much of (   ) he goes.|wherever^however^whether^whichever|1|〈make much of A（Aを大事にする・ちやほやする）〉の受動態〈He is made much of〉に、「どこへ行っても」を表す複合関係副詞 wherever he goes が続いています。|S4-ever|群動詞〈make much of〉の受動態で of が残る形と、wherever he goes の接続を問う良問です。
F2-097|what・複合関係詞|c|私の写真［絵］を，欲しい人ならだれにでもあげます。\\nI will give my picture to (   ) wants it.|whomever^whoever^anyone^no matter who|2|前置詞 to の目的語となるのは単語ではなく〈〜 wants it〉という節全体です。その節の中で動詞 wants の「主語」になっているため、whomever ではなく主格の whoever が正解です。|S4-ever|前置詞 to の直後だからと反射的に目的格 whomever を選ばせる、複合関係代名詞で最も引っかかりやすい問題です。
F2-104|what・複合関係詞|c|サトウさんはいわゆる真のインテリだ。\\nMr. Sato is (   ) you call a true intellectual.|what^who^which^that|1|第5文型〈call O C〉の O が関係代名詞 what になった〈what you call C〉で「いわゆるC（あなたがCと呼ぶところのもの）」という慣用表現になります。|S4-what|先行詞が人（Mr. Sato）に見えるため who を選びたくなりますが、イディオム〈what you call（いわゆる）〉として what を選ぶ問題です。
F2-108|what・複合関係詞|c|私たちがいつ友人の家に行っても，たくさんの食べ物でもてなしてくれる。\\n(   ) we go to our friend's house, they entertain us with a lot of food.|Wherever^Whoever^Whenever^Whichever|3|we go to our friend's house は場所（our friend's house）がすでに含まれた完全文なので Wherever ではなく、「〜するときはいつでも」を表す Whenever が正解です。|S4-ever|house があるからと Wherever を選ばせる罠です。すでに場所の目的語がある点に注目しましょう。
F2-112|what・複合関係詞|c|ありがとう，ヒロミ。この本はまさに私が欲しかった本です。\\nThank you, Hiromi. This book is exactly (   ) I wanted.|what^which^of which^that|1|is の後ろに先行詞となる名詞がなく、副詞 exactly が直後の名詞節〈what I wanted（私が欲しかったもの）〉を強めています。|S4-what|副詞 exactly を先行詞と誤認せず、先行詞を含む関係代名詞 what を選ぶ基本かつ重要な問題です。
F2-117|what・複合関係詞|c|自分が間違っていると信じることをするべきではない。\\nYou should not do (   ) you believe is wrong.|what^that^which^how|1|you believe は挿入節です。これを取り除くと〈You should not do what is wrong.（間違っていることをすべきではない）〉となり、先行詞を含み is の主語となる what が正解だとわかります。|S4-what|関係代名詞 what と連鎖関係代名詞（挿入節 you believe）が合体した応用問題です。
F2-001|接続詞(基本)|c|この部屋では上着を脱ぎなさい，そうしないと汗をかきますよ。\\nTake off your coat in this room, (   ) you will sweat.|and^or^unless^so|2|命令文の後ろに〈, or S + V〉を続けると「〜しなさい、そうしないと（さもないと）…になる」を表します。|S5-imp|〈命令文, and 〜（そうすれば）〉と〈命令文, or 〜（さもないと）〉を文脈（汗をかく）から判断させる問題です。
F2-006|接続詞(基本)|c|この女性がレースに勝つだろうということは間違いない。\\nThere's no doubt (   ) this woman is going to win the race.|about^for^what^that|4|名詞 no doubt（疑いがないこと）の具体的な内容を説明する「同格の接続詞 that」です。後ろが完全な文なので what は不可です。|S5-that|〈There is no doubt that S + V（SがVすることは疑いない）〉の重要構文を問うています。
F2-009|接続詞(基本)|c|その知らせに，彼女はあまりにもショックを受けたので，もう少しで気絶するところだった。\\nThe news gave her (   ) a shock that she nearly fainted.|so^such^very^too|2|空所の後ろが〈a shock〉という名詞句になっているため、形容詞の such を用いて〈such a shock that ...（あまりに大きなショックだったので〜）〉とします。|S5-so|so と such の使い分け（直後が a ＋単数可算名詞なら such）を問う入試超頻出問題です。
F2-014|接続詞(基本)|c|彼らが帰ったらすぐ連絡してほしいと彼女は私に依頼した。\\nShe asked me to contact her (   ) they returned.|directly^hardly^the moment^the instance|3|〈the moment [the instant] S + V〉で「SがVするとすぐに（＝as soon as S + V）」という時の副詞節を導きます（instance は「例」という意味で、瞬間は instant です）。|S5-time|〈the moment S + V〉の知識と、似た単語 the instance（例）とのひっかけを見抜けるかを試しています。
F2-015|接続詞(基本)|c|マイクはコーヒーも紅茶も好きではない。\\nMike likes (   ) coffee nor tea.|both^either^neither^not|3|後ろの nor tea と呼応して「AもBも〜ない」を表す〈neither A nor B〉を作ります。|S5-imp|nor とペアを組む相関接続詞 neither を正確に選ぶ基本問題です。
F2-019|接続詞(基本)|c|そのプロジェクトを終えるのにたったの3か月しかかからなかったことは，驚くべき偉業だ。\\n(   ) it took only three months to finish the project is an amazing achievement.|While^If^What^That|4|it took only three months to finish the project は欠けのない完全な文です。完全文を束ねて「〜ということは」と文全体の主語（単数扱い・動詞は is）にする接続詞 That が正解です。|S5-that|文頭の名詞節で、後ろが完全文なら That、不完全文なら What という識別ルールを問うています。
F2-020|接続詞(基本)|c|あなたは急いだほうがいい，さもないとそこには間に合わないだろう。\\nYou had better hurry up, (   ) you will not be there in time.|and^or^till^when|2|命令文と同じく、助言を表す〈You had better V（〜した方がいい）〉の後ろに〈, or ...〉を続けると「さもないと…になる」という意味になります。|S5-imp|had better による強い助言の文が、命令文＋or と同じ働きをすることをつかめているかが狙いです。
F2-021|接続詞(基本)|c|そのショッピングセンターはとても大きかったので，人々が出口を見つけられないということがよくあった。\\nThe shopping center was (   ) huge that people often couldn't find the exit.|very^much^so^as|3|形容詞 huge のみを挟んで後ろの that 節（結果）と呼応するため、副詞 so を用いた〈so huge that ...〉が正解です（very huge that とは言えません）。|S5-so|日本語の「とても〜なので…」に釣られて very を選ばせず、that節と呼応する相関語 so を選ばせる問題です。
F2-023|接続詞(基本)|c|彼女があなたを信じているということは，信じがたい。\\n(   ) she believes you is hard to believe.|What^That^Whatever^Whenever|2|she believes you は SVO が揃った完全文なので、それを名詞節にして「彼女があなたを信じているということは」と主語にする接続詞 That が正解です。|S5-that|短い文の中に believes と to believe が並び、かつ文頭が完全文であることから What ではなく That を選ばせる良問です。
F2-027|接続詞(基本)|c|今やその国には新しい民主主義政府があるので，その国民はついに，さらなる自由を手にすることだろう。\\n(   ) the country has a new democratic government, the people will at last have more freedom.|Although^Even if^In the event that^Now that|4|〈Now (that) S + V〉で「今やSがVしたからには・〜なので」と、新しい状況が生じたことを理由として述べる群接続詞です。|S5-that|文脈（新政府ができた→自由を手にする）から、逆接ではなく理由を表す〈Now that〉を選ばせる問題です。
F2-029|接続詞(基本)|c|とても天気のよい日だったので，彼らはハイキングに出かけた。\\nIt was (   ) a fine day that they went hiking.|such^so^what^then|1|空所の後ろが〈a fine day〉という「冠詞＋形容詞＋名詞」の語順なので、〈such a fine day that ...〉となります（so を使うなら so fine a day）。|S5-so|〈such a 形 名 that〉と〈so 形 a 名 that〉の語順の鉄則を問うています。
F2-030|接続詞(基本)|c|ロバートは，そのホールの中にいる全員に聞こえるように，大きな声で結婚式のスピーチをしました。\\nRobert made a (   ) speech at the wedding so that all the people in the hall could hear him.|choking^hoarse^loud^low|3|〈so that S + could hear him（全員に彼の声が聞こえるように）〉という目的の副詞節に合わせて、形容詞は loud（大きな声の）となります。|S5-purp|目的構文〈so that S + could V〉の組み立てと、文脈に合う形容詞 loud の選択を問うています。
F2-035|接続詞(基本)|c|その女性は年をとるにつれて，より美しくなった。\\nThe woman became more beautiful (   ) she got older.|as^before^from^if|1|主節と従属節に比較級（more beautiful / older）を伴い、「〜するにつれて」という比例・同時進行を表す接続詞 as です。|S5-time|2つの変化が同時に進む「〜するにつれて」の as を正確に選べるかを見ています。
F2-038|接続詞(基本)|c|私が彼に話しかけるやいなや，彼は行ってしまった。\\nHardly (   ) to him before he was gone.|had I spoken^I have spoken^I spoke^I was spoken|1|「〜するやいなや」を表す〈Hardly [Scarcely] had S + p.p. before [when] S' + V'〉の構文です。否定の副詞 Hardly が文頭に出ているため、〈had I spoken〉と過去完了が疑問文語順に倒置されます。|S5-time|「過去完了時制（had spoken）」「文頭否定語による倒置（had I spoken）」「接続詞 before/when」の3大要素を問う最重要構文です。
F2-041|接続詞(基本)|c|海外旅行は多くの人にとってわくわくするものだ。けれども，自分の国をとても恋しがってホームシックになる人も少しはいる。\\nThere are, however, a few who miss their own countries (   ) that they become homesick.|so^such^so many^so much|4|動詞 miss（恋しがる）の程度を修飾して「とても恋しがるので〜だ」とするため、単なる so ではなく副詞句の〈so much〉を用いて〈miss ... so much that S + V〉とします。|S5-so|形容詞や副詞がない動詞（miss）の後ろでは、単なる so ではなく〈so much that〉にしなければならないという盲点を突いた良問です。
F2-046|接続詞(基本)|c|ある男性が私の隣に住んでいるという事実が，彼は私の友人であるということを意味するわけではない。\\nThe fact (   ) a man lives next door to me does not mean he is my friend.|if^of^that^which|3|a man lives next door to me は第1文型の完全な文です。抽象名詞 The fact の中身を説明する「同格の接続詞 that」を選びます（関係代名詞 which は不可）。|S5-that|先行詞があるように見えるため which を選びたくなりますが、後ろが完全文なので同格の that になるという頻出識別問題です。
F2-047|接続詞(基本)|c|私は夏の別荘を建てるためにその土地を買った。\\nI bought the land (   ) I could build a summer house.|as^so that^that^whether|2|「〜するために」という目的の副詞節を導く〈so that S + can/could/may/might V〉の基本構文です。|S5-purp|後ろの助動詞 could と呼応して目的を表す群接続詞 so that を選ばせる問題です。
F2-052|接続詞(基本)|c|シェイクスピアは，作家であっただけではなく，俳優でもあった。\\nShakespeare was not only a writer (   ) also an actor.|but^again^even^ever|1|〈not only A but (also) B〉で「AだけでなくBも」を表します。|S5-imp|相関表現の基本である not only 〜 but also ... の正確な語順を確認しています。
F2-059|接続詞(基本)|c|私が電車に足を踏み入れるやいなや，ドアが閉まった。\\nI had no sooner stepped into the train (   ) the door closed.|and^as^than^that|3|「〜するやいなや」を表す〈S + had no sooner + p.p. than S' + V'〉の構文です。比較級 no sooner と呼応するため接続詞は than になります。|S5-time|〈hardly ... when/before〉と〈no sooner ... than〉のペアの混同（no sooner に when を使ってしまう等）を狙っています。
F2-065|接続詞(基本)|c|ケイコはとても親切な女の子なので，だれもが彼女のことが好きだ。\\nKeiko is such a nice girl (   ) everyone likes her.|how^that^who^why|2|前の such a nice girl と呼応して「とても〜なので…だ」と結果の副詞節を導く接続詞 that です。|S5-so|直前に a nice girl（人）があるため、関係代名詞 who を選ばせる罠が仕掛けられています。後ろが everyone likes her と完全文であり、前の such と呼応する that を見抜く良問です。
F2-066|接続詞(基本)|c|事故が少なくなるように，新しい交通安全の法律が導入された。\\nNew traffic safety laws were introduced (   ) there would be fewer accidents.|so that^as if^in case^just as|1|「事故がより少なくなるように」という目的を表す〈so that S + would V〉の構文です。|S5-purp|後ろの助動詞 would と文脈から、目的の接続詞 so that（in case なら「事故が減るといけないから」と逆の意味になる）を選ばせます。
F2-069|接続詞(基本)|c|ある人の幼少時代の経験は，その人が大人としてどうふるまうかに影響を与えると信じる心理学者もいる。\\nSome psychologists believe (   ) a person's early childhood experiences affect how he or she behaves as an adult.|if^so^that^what|3|believe の目的語となる名詞節を導く接続詞 that です。節内は a person's early childhood experiences (S) ＋ affect (V) ＋ how... (O) と完全な文になっています。|S5-that|長文構造の中で、believe の目的語節を導く接続詞 that と、節内の主語・本動詞 affect を正しく組み立てさせる問題です。
F2-072|接続詞(基本)|c|彼女はみんなが読めるように自分の詩を出版したいと思った。\\nShe wanted to publish her poetry (   ) everyone could read it.|in that^so much^so that^that which|3|「誰もがそれを読めるように」という目的を表す〈so that S + could V〉の構文です。|S5-purp|in that（〜という点で）などの紛らわしい選択肢から、目的を表す so that を選ばせる問題です。
F2-081|接続詞(基本)|c|地震があるたびに，より多くの人が自然とはなんと力強いものかと知るようになるだろうと私は思う。\\nI think that (   ) there is an earthquake, more people will come to realize how powerful nature is.|even if^every^every time^every other|3|〈every time [each time] S + V〉は、それ自体が接続詞のように働いて「SがVするたびに（＝whenever S + V）」という時の副詞節を導きます（every 単体では接続詞になれません）。|S5-time|every 単体と every time（接続詞機能）の文法的な違いを問うセンター試験の頻出問題です。
F2-095|接続詞(基本)|c|彼女が後ろを向くとすぐに，その男の子はクッキーの入ったビンに手を伸ばした。\\nHardly (   ) her back when the boy reached for the cookie jar.|she had turned^had she turned^did she turn^she turned|2|「彼女が後ろを向くやいなや」を表す〈Hardly had S + p.p. when S' + V'〉の倒置構文です。文頭の Hardly により過去完了が〈had she turned〉と倒置されます。|S5-time|過去形 did she turn ではなく、過去完了の倒置形〈had she turned〉を選ばせる関西学院大の定番問題です。
F2-096|接続詞(基本)|c|太陽が東から昇るので，日本は長い間「日出づる国」と呼ばれてきた。\\n(   ) the sun rises in the east, Japan has long been called "the land of the rising sun."|Since^If^When^For|1|相手も知っている周知の理由（「〜なので」）を文頭で述べる接続詞 Since です（等位接続詞の for も「というのは〜だから」を表しますが、文頭には置けません）。|S5-that|理由を表す Since と For の位置ルール（文頭に置けるのは Since）および主節との論理関係を問うています。
F2-099|接続詞(基本)|c|今日はとても天気のよい日なので，私たちは外に出かけるべきだ。\\nIt's (   ) day today that we should go outside.|such beautiful^so beautiful^so beautiful a^a so beautiful|3|単数可算名詞 day があるため冠詞 a が必須です。so を用いる場合は〈so ＋形容詞(beautiful)＋ a ＋名詞(day)〉の語順になります（such なら such a beautiful day）。|S5-so|〈so 形 a 名〉の語順と、単数可算名詞 day に冠詞 a が抜けてはいけない点を突いた青山学院大の頻出問題です。
F2-101|接続詞(基本)|c|消費者は使うお金を少なくしたいので，ふつう，商品の値段が下がるほどさらにそれを買いたい気持ちになる。\\nConsumers are usually willing to buy more of an item as its price falls (   ) they want to spend less money.|because^because of^though^unless|1|「価格が下がるにつれて（as its price falls）」「より少ないお金を使いたいので（because they want to spend less money）」と2つの接続詞が続きます。後ろが SV の節なので前置詞句 because of ではなく接続詞 because が正解です。|S5-time|接続詞 because（＋SV）と群前置詞 because of（＋名詞句）の区別、および比例の as の構築を問うています。
F2-103|接続詞(基本)|c|私は猫よりも犬のほうが従順だという点で好きだ。\\nI like dogs better than cats in (   ) they are more obedient.|which^what^that^whom|3|「前置詞の直後に関係代名詞 that は置けない」という原則の重要な例外として、接続詞の〈in that S + V（SがVだという点で・〜だから）〉があります。|S5-imp|「in の後ろだから that はダメで which だ！」と機械的に考える受験生を逆手に取った、群接続詞〈in that〉の超定番問題です。
F2-105|接続詞(基本)|c|自分がどのような仕事に向いているかがわかるまでに，ずいぶん時間がかかった。\\nIt was a long time (   ) I realized what sort of job would be suitable for me.|after^before^during^while|2|〈It was ＋時間＋ before S + V〉で「SがVするまでに（長い）時間がかかった／しばらくしてやっとSがVした」を表す重要構文です。|S5-time|日本語の「〜してから」に釣られて after を選ばせず、〈It is [was] ... before 〜〉の構文知識を問うています。
F2-107|接続詞(基本)|c|世界の多くの人々が耐えられない貧困の中で暮らしているという事実は，我々みんなの関心事であるべきだ。\\nThe fact (   ) many people in the world live in intolerable poverty must concern all of us.|that^which^in which^where|1|many people in the world live in intolerable poverty は第1文型の完全な文です。The fact の具体的内容を示す同格の接続詞 that が正解です。|S5-that|The fact の後ろが完全文であることから、関係詞（which / where）ではなく同格の接続詞 that を選ばせる問題です。
F2-109|接続詞(条件・譲歩)|c|彼は運転免許証もクレジットカードも持っていなかった。\\nHe had neither his driver's license (   ) his credit card with him.|and^but^nor^or|3|〈neither A nor B（AもBも〜ない）〉の構文です。either A or B と混同して neither ... or にしないよう注意が必要です。|S6-cond|neither と呼応する接続詞として or ではなく nor を正確に選べるかを問うています。
F2-115|接続詞(条件・譲歩)|c|急ぎなさい，そうすれば彼に追いつくことができるでしょう。\\nHurry up, (   ) you'll be able to catch up with him.|otherwise^but^and^or|3|命令文 Hurry up の後ろに〈, and S + V〉を続けて「急ぎなさい、そうすれば追いつけるだろう」を表します。|S6-cond|文脈（追いつくことができる＝望ましい結果）から、or ではなく and を選ぶ問題です。
F2-118|接続詞(条件・譲歩)|c|彼の両親は，冬が寒すぎたので，国の暖かい地方に引っ越した。\\nHis parents moved to the warmer part of the country (   ) the winters were too cold for them.|since^and^due to^unless|1|後ろに the winters were too cold for them という SV の節が続き、「冬が寒すぎたので」という理由を表すため、接続詞の since が正解です（due to は前置詞句なので後ろに節は置けません）。|S6-cond|意味が同じ「〜のために」でも、後ろが節（SV）なので群前置詞 due to ではなく接続詞 since を選ぶ品詞識別問題です。
F2-120|接続詞(条件・譲歩)|c|スズキ氏の講演は，興味深いだけではなく，やる気にさせるものでもある。\\nMr. Suzuki's lectures are not only interesting (   ) also motivating.|and^but^either^or|2|形容詞 interesting と motivating を〈not only A but also B〉で対等に結んでいます。|S6-cond|相関接続詞 not only 〜 but also ... の基本構造を確認しています。
F2-131|接続詞(条件・譲歩)|c|宿題を終えるまで今夜は眠らないつもりだ。\\nI'm not going to sleep tonight (   ) I finish my homework.|by^during^until^since|3|「…するまで〜しない」は継続の接続詞 until を使います（by と during は前置詞なので後ろに節は不可）。また時の副詞節内なので未来のことでも現在形 finish を用います。|S6-cond|前置詞（by / during）と接続詞（until）の区別、および時の副詞節内の現在形を問うています。
F2-134|接続詞(条件・譲歩)|c|彼女は私がこれまでに会った中で最もロマンチックな女性だ。私が彼女を見た瞬間に，彼女は私の心を捕らえた。\\nShe is the most romantic woman I've ever met. (   ) I saw her, she captured my heart.|The moment^In case^Either^Though|1|〈The moment S + V〉が接続詞として働き、「私が彼女を見た瞬間に（＝As soon as I saw her）」を表します。|S6-cond|名詞句 The moment が接続詞として節を導く用法を知っているかを試しています。
F2-004|接続詞(条件・譲歩)|c|私が知る限りでは，彼女はもうそこで働いていない。\\nAs (   ) as I know, she no longer works there.|far^little^long^much|1|「〜する範囲では・〜する限りでは」と知識や視覚などの範囲を表すときは〈as far as〉を用います。〈as far as I know〉で「私の知る限りでは」です。|S6-cond|〈as far as（範囲：〜する限り）〉と〈as long as（条件・期間：〜しさえすれば）〉の超重要識別問題です。
F2-010|接続詞(条件・譲歩)|c|夜に寒くなるといけないから，このセーターを持って行きなさい。\\nTake this sweater with you in (   ) it should get cold in the evening.|brief^case^example^that|2|「万一〜するといけないから・〜する場合に備えて」は群接続詞〈in case S + (should) V〉で表します。|S6-case|万一の事態への備えを表す〈in case〉と、節内で助動詞 should がよく使われる語法を問うています。
F2-011|接続詞(条件・譲歩)|c|あなたがすぐ返してくれるなら，その本をお貸しするのはかまいませんよ。\\nI don't mind lending you the book (   ) you give it back soon.|provided^supposed^unless^which|1|分詞由来の接続詞〈provided (that) S + V〉または〈providing (that) S + V〉で「もしSがVならば（＝if）」という条件を表します（supposing は現在分詞形なら可ですが過去分詞 supposed 単体では不可）。|S6-cond|provided（条件の接続詞）と supposed（単体では不可、supposing なら可）の正確な語法知識を問う近畿大の良問です。
F2-017|接続詞(条件・譲歩)|c|水が冷たいにもかかわらず，少年たちは池に飛び込んだ。\\nCold (   ) the water was, the boys jumped into the pond.|as^as if^even if^like|1|本来は Though the water was cold ですが、補語の形容詞 Cold を文頭に出し、接続詞 as（または though）を用いた〈形容詞＋ as ＋ S + V〉で「〜だけれども」という譲歩を表します。|S6-conc|文頭に形容詞 Cold が飛び出している特殊語順から、譲歩の as を見抜かせる入試頻出の重要構文です。
F2-018|接続詞(条件・譲歩)|c|ただおもしろければどんな本でもかまわない。\\nAny book will do (   ) it is interesting.|as long as^as far as^as much as^as well as|1|「〜しさえすれば・〜である限りは（＝only if）」という条件を表す群接続詞〈as long as〉です。また自動詞 do は「間に合う・役に立つ（かまわない）」という意味です。|S6-cond|条件の〈as long as〉と範囲の〈as far as〉の使い分け、および自動詞 do（間に合う）の語法を問うています。
F2-022|接続詞(条件・譲歩)|c|もっと一生懸命勉強しなければ，あなたは試験に合格しないだろう。\\n(   ) you study much harder, you won't pass the exam.|Unless^If^In case^Since|1|「もしあなたがもっと一生懸命勉強しなければ（＝If you don't study much harder）」を表す接続詞 Unless です。|S6-cond|主節（合格しないだろう）との論理関係から、肯定条件の If ではなく否定条件の Unless を選ばせる問題です。
F2-028|接続詞(条件・譲歩)|c|もっと速く運転するのでなければ，コンサートに遅れるだろう。\\n(   ) you drive faster, you will be late for the concert.|Since^Though^Unless^While|3|Drive faster, or you will be late... と同意の〈Unless you drive faster（もっと速く運転しない限り）〉です。|S6-cond|〈命令文, or ...〉と〈Unless S + V, ...〉の書き換えおよび論理関係を問うています。
F2-031|接続詞(条件・譲歩)|c|電車に乗りそこねてしまったら，私たちはどうしよう。\\n(   ) we miss the train, what shall we do?|Having^Looking^Being^Supposing|4|分詞由来の接続詞〈Supposing (that) S + V〉で「もし〜なら（＝If）」を表し、特に主節が疑問文（what shall we do?）のときによく使われます。|S6-cond|分詞構文ではなく、条件の接続詞として確立している Supposing の語法を狙っています。
F2-042|接続詞(条件・譲歩)|c|ケンは早朝のどが痛く熱があったけれども，朝食後学校へ向かった。\\n(   ) Ken had a sore throat and a fever early in the morning, he left for school after he had breakfast.|As^However^If^Though|4|「のどが痛く熱があったけれども学校へ向かった」という逆接・譲歩の副詞節を導く接続詞 Though（または Even though）が正解です（However は副詞なので SV の節を直接導けません）。|S6-conc|接続詞 Though / Even though と副詞 However の品詞・文法的働きの違いを問うています。
F2-045|接続詞(条件・譲歩)|c|私の知る限りでは，出荷品は来週届くだろう。\\nThe shipment will arrive next week as (   ) as I know.|far^little^often^soon|1|知識の及ぶ範囲を表す〈as far as I know〉です。文末に置かれることもよくあります。|S6-cond|定型表現〈as far as I know〉を文末でも正確に構成できるかを確認しています。
F2-050|接続詞(条件・譲歩)|c|土曜日の朝働くという条件で，あなたに休暇を与えよう。\\nI'll give you the day off on (   ) that you work on Saturday morning.|condition^exchange^promise^terms|1|〈on condition that S + V〉で「SがVするという条件で」を表す群接続詞です。条件の副詞節なので未来のことでも現在形 work を使います。|S6-cond|〈on condition that S + V〉の正確な名詞選択（condition）と語順を問う津田塾大の問題です。
F2-053|接続詞(条件・譲歩)|c|明日電車が満席だといけないから，今日席を予約するほうがよい。\\nI had better reserve a seat today (   ) the train is full tomorrow.|as if^even if^in case^even though|3|「明日電車が満席の場合に備えて（満席だといけないから）」を表す群接続詞〈in case〉です。副詞節内なので tomorrow があっても現在形 is を使います。|S6-case|even if（たとえ〜でも）と in case（〜するといけないから）の意味の違いを文脈から判断させる良問です。
F2-071|接続詞(条件・譲歩)|c|たとえあなたがだれと話しているかわかっているとしても，電話でだれかに自分のクレジットカードの番号を言わないことが大切だ。\\nIt is important not to give out your credit card number to anyone over the phone (   ) you know who you are talking to.|so that^even if^but^or|2|「たとえ相手が誰かわかっていても」という仮定・譲歩を表す群接続詞〈even if〉です。また形式主語構文〈It is important not to V〉の形も重要です。|S6-conc|不定詞の否定形〈not to give out〉の語順と、譲歩の〈even if〉を正確に組み立てる力を問うています。
F2-077|接続詞(条件・譲歩)|c|メアリーが本当にそのお金を盗んだのかどうかははっきりしない。\\n(   ) Mary actually stole the money or not is unclear.|If^How^What^Whether|4|「〜かどうか」という名詞節が文頭で「文全体の主語」になる場合、Whether は使えますが If は使えません。|S6-conc|「〜かどうか＝if / whether」と覚えている受験生に対し、文頭の主語節には Whether しか使えないという重要ルールを問う青山学院大の頻出問題です。
F2-085|接続詞(条件・譲歩)|c|母が私の大好物を作ってくれたのに，今朝は朝食を食べる時間がなかった。\\nI didn't have time to eat breakfast this morning (   ) my mother cooked my favorite dish.|since^even though^given that^regardless|2|「母が大好物を作ってくれた（事実）にもかかわらず、食べる時間がなかった」という逆接を表す〈even though〉が正解です。|S6-conc|文脈から逆接関係を把握し、後ろに節をとれる接続詞 even though（regardless は副詞/regardless of 名詞）を選ばせます。
F2-086|接続詞(条件・譲歩)|c|そのパンクしたタイヤを修理してもらうまで，あなたは車を運転できないだろう。\\nYou won't be able to drive your car (   ) you get that flat tire fixed.|until^after^since^during|1|「タイヤを修理してもらうまでは運転できない（修理して初めて運転できる）」という〈not ... until S + V〉と、〈get + O (that flat tire) + p.p. (fixed)〉の重要表現が組み合わさっています。|S6-cond|〈not ... until〉の接続詞選択と、第5文型〈get that flat tire fixed〉の語順を同時に見る良問です。
F2-092|接続詞(条件・譲歩)|c|今年は東京でたくさんの約束があったので，計画していたようにアメリカに行かずに，春の大半をそこで過ごした。\\nThis year I had so many commitments in Tokyo that I spent most of the spring there, instead of going to America (   ) I had planned.|as^if^since^that|1|〈as I had planned〉で「私が計画していた通りに（ように）」という様態を表す接続詞 as です。|S6-conc|群前置詞〈instead of doing〉と、様態の接続詞〈as I had planned〉の組み合わせを問うています。
F2-110|接続詞(条件・譲歩)|c|夕食に間に合って帰宅するのなら，買い物に行ってもいいですよ。\\nYou can go shopping, as (   ) as you come home in time for dinner.|far^long^much^well|2|「夕食に間に合って帰ってきさえすれば（条件）」を表すので〈as long as〉が正解です。|S6-cond|条件を表す場面で as far as ではなく as long as を確実に選べるかを問う学習院大の頻出問題です。
F2-113|接続詞(条件・譲歩)|c|遅い時間だったけれども，私たちは友人たちを訪ねることに決めた。\\nLate (   ) it was, we decided to visit our friends.|as^on^but^even|1|Though it was late の補語 Late を文頭に出した〈Late as it was（遅い時間だったけれども）〉という譲歩の倒置構文です。|S6-conc|文頭の形容詞 Late の直後に置かれて譲歩を表す接続詞 as を見抜かせる問題です。
F2-116|接続詞(条件・譲歩)|c|美しい女性だけれども，メアリーはとても謙虚である。\\n(   ) she is, Mary is very humble.|A beautiful woman though^Beautiful as^Beautifully woman as^As beautiful so|2|〈形容詞(Beautiful)＋ as ＋ S + V〉で「彼女は美しいけれども」を表します（名詞を前に出す場合は無冠詞で Woman as she is とするため、A beautiful woman though は誤りです）。|S6-conc|譲歩の倒置構文〈形容詞＋ as ＋ S + V〉の正確な形と、冠詞付きの単数名詞は前に出せないという細かいルールまで突いた良問です。
F2-122|接続詞(条件・譲歩)|c|それが本当かどうかはあまり重要にはならないだろう。\\nWhether (   ) not matter much.|is it true or not does^it is true or not will^or not true will be^true or not is|2|〈Whether it is true or not（それが本当かどうか）〉という平叙文語順の名詞節全体が主語になり、その後に助動詞＋動詞の〈will not matter much〉が続きます。|S6-conc|名詞節内の語順（疑問文語順 is it ではなく平叙文語順 it is）と、文全体の本動詞 will not matter のつながりを問うています。
F2-125|接続詞(条件・譲歩)|c|ヘレンは疲れすぎていなければ，毎朝ジョギングをする。\\nHelen jogs every morning (   ) she is too tired.|despite^without^whether^unless|4|「疲れすぎていない限りは（疲れすぎていなければ）」という否定の条件を表す接続詞 unless です（despite や without は前置詞なので後ろに節は不可）。|S6-cond|前置詞（despite / without）を排除し、文脈に合う接続詞 unless を選ぶ問題です。
F2-126|接続詞(条件・譲歩)|c|彼女にはたくさん宿題があるけれども，今夜は遅くまで起きてテレビを見るつもりだ。\\n(   ) she has a lot of homework, she is going to stay up late watching TV tonight.|In spite of^Even though^Therefore^However|2|後ろに she has a lot of homework という SV の節が続いているため、群前置詞 In spite of や副詞 However ではなく、接続詞の Even though が正解です。|S6-conc|入試で最もよく出る「Even though（接続詞＋SV）vs. In spite of（群前置詞＋名詞）vs. However（副詞）」の品詞識別問題です。
F2-128|接続詞(条件・譲歩)|c|多くの日本人は英語がよくわかっていても外国人に話しかけるのをためらう。\\nMany Japanese people are hesitant to speak to foreigners (   ) they know English well.|as^even^even if^as to|3|「たとえ英語がよくわかっていても」を表す群接続詞〈even if〉です（even 単体は副詞なので接続詞にはなれません）。|S6-conc|副詞 even 単体では節をつなげないため、接続詞 if を伴った even if を選ばせる問題です。

V-55|Vintage 演習(56問)|e|【誤文訂正】花子は太郎にだまされたとばかり思い込んでいたが，後になって実は花子をだましたのは次郎だったことを知った。（京都産業大）[Vintage 512]\\nHanako believed that she <span class="text-rose-600 font-bold underline">①had been fooled</span> by Taro, but <span class="text-rose-600 font-bold underline">②later learned</span> that <span class="text-rose-600 font-bold underline">③it was</span> actually Jiro <span class="text-rose-600 font-bold underline">④that she was fooled</span>.|① had been fooled^② later learned^③ it was^④ that she was fooled (→ that fooled her)|4|「花子をだましたのは次郎だった（能動）」なので、It was actually Jiro that fooled her に訂正する必要があります（④のままだと Jiro の入る場所がなく文が破綻します）。|V-cleft|強調構文の後ろの節が能動態か受動態かを文構造から見抜かせる京都産業大の正誤問題です。
V-56|Vintage 演習(56問)|c|私が昨日ここで会ったのはアンディでした。（立正大）[Vintage 512]\\n(   ) here yesterday.|It was Andy whom I met^It was Andy I met whom^Andy it was whom I met^It is Andy whom I met|1|目的語の人（Andy）を強調し、時制が過去（yesterday）なので〈It was Andy whom I met here yesterday.〉となります。|V-cleft|強調構文〈It was 人 whom S + V〉の時制と語順を問うています。
`;

    // 圧縮された文字列からJavaScriptのオブジェクト配列に変換
    const qData = rawData.trim().split('\n').map(line => {
      const p = line.split('|');
      if (p.length < 9) return null;
      return {
        i: p[0], s: p[1], t: p[2], 
        q: p[3].replace(/\\n/g, '\n'), 
        c: p[4] ? p[4].split('^') : [], 
        a: parseInt(p[5], 10), 
        e: p[6],
        g: p[7],
        m: p[8]
      };
    }).filter(Boolean);

    let state = {
      currentMode: 'menu', 
      questions: [],
      currentIndex: 0,
      score: 0,
      mistakes: JSON.parse(localStorage.getItem('pf850VintageMistakes') || '[]'),
      progress: JSON.parse(localStorage.getItem('pf850VintageProgress') || '{}'),
      currentQuizMode: null,
      isAnswered: false,
      selectedAnswer: null,
      isCorrect: false
    };

    function setState(newState) {
      state = { ...state, ...newState };
      if (newState.mistakes !== undefined) {
        localStorage.setItem('pf850VintageMistakes', JSON.stringify(state.mistakes));
      }
      if (newState.progress !== undefined) {
        localStorage.setItem('pf850VintageProgress', JSON.stringify(state.progress));
      }
      render();
    }

    function getQuestionTypeLabel(type) {
      if (type === 'e') return '誤文訂正問題（誤りを含む箇所を選択）';
      if (type === 'd') return '2空所・共通語補充問題';
      return '四択問題（空所に適切な語句を選択）';
    }

    window.startQuiz = function(mode, resume = false) {
      let targetQuestions = [];
      let currentIdx = 0;
      let currentScore = 0;

      if (resume && state.progress[mode]) {
        const prog = state.progress[mode];
        targetQuestions = prog.order.map(id => qData.find(q => q.i === id)).filter(Boolean);
        currentIdx = prog.currentIndex;
        currentScore = prog.score;
      } else {
        if (mode === 'all') {
          targetQuestions = [...qData].sort(() => Math.random() - 0.5);
        } else if (mode === 'mistakes') {
          targetQuestions = qData.filter(q => state.mistakes.includes(q.i)).sort(() => Math.random() - 0.5);
        } else {
          targetQuestions = qData.filter(q => q.s === mode).sort(() => Math.random() - 0.5);
        }

        if (targetQuestions.length === 0) {
          alert('出題できる問題がありません。');
          return;
        }

        state.progress[mode] = { order: targetQuestions.map(q => q.i), currentIndex: 0, score: 0 };
        localStorage.setItem('pf850VintageProgress', JSON.stringify(state.progress));
      }

      setState({
        currentMode: 'quiz',
        currentQuizMode: mode,
        questions: targetQuestions,
        currentIndex: currentIdx,
        score: currentScore,
        isAnswered: false,
        selectedAnswer: null,
        isCorrect: false
      });
    };

    window.goNext = function() {
      if (state.currentIndex + 1 < state.questions.length) {
        const nextIdx = state.currentIndex + 1;
        if (state.progress[state.currentQuizMode]) {
          state.progress[state.currentQuizMode].currentIndex = nextIdx;
          state.progress[state.currentQuizMode].score = state.score;
          localStorage.setItem('pf850VintageProgress', JSON.stringify(state.progress));
        }
        setState({ currentIndex: nextIdx, isAnswered: false, selectedAnswer: null, isCorrect: false });
      } else {
        if (state.progress[state.currentQuizMode]) {
          delete state.progress[state.currentQuizMode];
          localStorage.setItem('pf850VintageProgress', JSON.stringify(state.progress));
        }
        setState({ currentMode: 'result' });
      }
    };

    window.goToMenu = function() { setState({ currentMode: 'menu' }); };

    window.handleChoiceSubmit = function(choiceIndex) {
      if (state.isAnswered) return;
      const currentQ = state.questions[state.currentIndex];
      const isCorrect = (choiceIndex + 1) === currentQ.a;
      let newMistakes = [...state.mistakes];
      let newScore = state.score;

      if (isCorrect) {
        newScore += 1;
        newMistakes = newMistakes.filter(id => id !== currentQ.i);
      } else {
        if (!newMistakes.includes(currentQ.i)) newMistakes.push(currentQ.i);
      }
      setState({ isCorrect, selectedAnswer: choiceIndex + 1, isAnswered: true, score: newScore, mistakes: newMistakes });
    };

    function renderMenuHtml() {
      const stepNames = [
        '一致・数',
        '倒置・強調・省略',
        '関係詞',
        'what・複合関係詞',
        '接続詞(基本)',
        '接続詞(条件・譲歩)',
        '誤文訂正・2空所',
        'Vintage 演習(56問)'
      ];
      let stepsHtml = '';
      
      stepNames.forEach(step => {
        const p = state.progress[step];
        const hasProgress = p && p.currentIndex > 0 && p.currentIndex < p.order.length;
        const count = qData.filter(q => q.s === step).length;
        if (count === 0) return;

        const isVintage = step.startsWith('Vintage');
        const activeBorder = isVintage
          ? (hasProgress ? 'border-indigo-500 shadow-md bg-indigo-50' : 'border-indigo-200 hover:border-indigo-400 hover:shadow-md bg-indigo-50/40')
          : (hasProgress ? 'border-blue-400 shadow-md bg-blue-50' : 'border-slate-200 hover:border-blue-400 hover:shadow-md bg-white');

        stepsHtml += `
          <div class="flex flex-col relative w-full h-full">
            <button onclick="startQuiz('${step}', ${hasProgress ? 'true' : 'false'})" class="flex flex-col items-center justify-center border ${activeBorder} text-slate-700 p-3 md:p-4 rounded-xl transition-all h-full w-full">
              <span class="font-bold text-base md:text-lg ${isVintage ? 'text-indigo-900' : ''}">${step}</span>
              <span class="text-xs md:text-sm mt-1 ${hasProgress ? 'text-blue-600 font-bold' : 'text-slate-400'}">
                ${hasProgress ? `続きから ${p.currentIndex}/${p.order.length}問` : `${count}問`}
              </span>
            </button>
            ${hasProgress ? `
              <button onclick="startQuiz('${step}', false)" class="absolute -top-2 -right-2 bg-white border border-slate-200 shadow-sm rounded-full p-1.5 text-slate-400 hover:text-red-500 transition-colors" title="最初からやり直す">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
              </button>
            ` : ''}
          </div>
        `;
      });

      const pAll = state.progress['all'];
      const hasAllProgress = pAll && pAll.currentIndex > 0 && pAll.currentIndex < pAll.order.length;
      const pMistakes = state.progress['mistakes'];
      const hasMistakesProgress = pMistakes && pMistakes.currentIndex > 0 && pMistakes.currentIndex < pMistakes.order.length;
      const mistakesDisabled = !hasMistakesProgress && state.mistakes.length === 0;

      return `
        <div class="flex flex-col items-center justify-center h-full p-4 md:p-8 space-y-6 md:space-y-8 fade-in">
          <div class="text-center space-y-3 md:space-y-4 mt-6 md:mt-12">
            <span class="inline-block px-3 py-1 bg-blue-100 text-blue-800 text-xs font-bold rounded-full mb-2 tracking-wider">PF 850 + VINTAGE 3RD EDITION</span>
            <h1 class="text-2xl md:text-4xl font-bold text-slate-800 tracking-tight">POWER FRAME 850 × Vintage 文法道場</h1>
            <p class="text-sm md:text-base text-slate-500 font-medium">一致・倒置・強調・省略・話法・関係詞・接続詞・誤文訂正（全${qData.length}問）</p>
          </div>

          <div class="grid grid-cols-2 gap-3 md:gap-4 w-full max-w-2xl">
            <div class="flex flex-col w-full h-full col-span-2 md:col-span-1">
              <button onclick="startQuiz('all', ${hasAllProgress ? 'true' : 'false'})" class="flex flex-col items-center justify-center bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-xl shadow-md transition-all transform hover:scale-105 h-full w-full">
                <div class="flex items-center space-x-2 md:space-x-3">
                  <i data-lucide="play" class="w-5 h-5 md:w-6 md:h-6"></i>
                  <span class="text-base md:text-lg font-semibold">${hasAllProgress ? '全問題 (続きから)' : '全問題に挑戦'}</span>
                </div>
                <span class="text-xs md:text-sm text-blue-200 mt-1">${hasAllProgress ? `${pAll.currentIndex}/${pAll.order.length}問` : `${qData.length}問`}</span>
              </button>
              ${hasAllProgress ? `<button onclick="startQuiz('all', false)" class="mt-2 text-xs md:text-sm text-slate-500 hover:text-blue-600 underline transition-colors text-center">最初からやり直す</button>` : ''}
            </div>

            <div class="flex flex-col w-full h-full col-span-2 md:col-span-1">
              <button 
                onclick="startQuiz('mistakes', ${hasMistakesProgress ? 'true' : 'false'})" 
                ${mistakesDisabled ? 'disabled' : ''}
                class="flex flex-col items-center justify-center p-4 rounded-xl shadow-md transition-all h-full w-full ${!mistakesDisabled ? 'bg-orange-500 hover:bg-orange-600 text-white transform hover:scale-105' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}">
                <div class="flex items-center space-x-2 md:space-x-3">
                  <i data-lucide="refresh-cw" class="w-5 h-5 md:w-6 md:h-6"></i>
                  <span class="text-base md:text-lg font-semibold">${hasMistakesProgress ? '間違えた問題 (続き)' : '間違えた問題'}</span>
                </div>
                <span class="text-xs md:text-sm mt-1 opacity-80">${hasMistakesProgress ? `${pMistakes.currentIndex}/${pMistakes.order.length}問` : `${state.mistakes.length}問`}</span>
              </button>
              ${hasMistakesProgress ? `<button onclick="startQuiz('mistakes', false)" class="mt-2 text-xs md:text-sm text-slate-500 hover:text-orange-600 underline transition-colors text-center">新しく間違えたリストでやり直す</button>` : ''}
            </div>

            <div class="col-span-2 pt-4 md:pt-6 pb-1 md:pb-2 border-b border-slate-200">
              <h2 class="text-xs md:text-sm font-bold text-slate-400 uppercase tracking-wider text-center">分野別に出題</h2>
            </div>
            
            ${stepsHtml}
          </div>
        </div>
      `;
    }

    function renderQuizHtml() {
      const currentQ = state.questions[state.currentIndex];
      const typeLabel = getQuestionTypeLabel(currentQ.t);
      const concept = conceptGroups[currentQ.g] || { title: "解説ポイント", e: "文脈と文法構造から最適な選択肢を選びましょう。" };
      
      let choicesHtml = '';
      currentQ.c.forEach((choiceText, idx) => {
        let btnStyle = "bg-white border-2 border-slate-200 text-slate-700 hover:border-blue-400 hover:bg-blue-50";
        if (state.isAnswered) {
          if ((idx + 1) === currentQ.a) {
            btnStyle = "bg-green-100 border-2 border-green-500 text-green-800 font-bold z-10 shadow-md"; 
          } else if (state.selectedAnswer === (idx + 1)) {
            btnStyle = "bg-red-50 border-2 border-red-300 text-red-600 line-through opacity-70"; 
          } else {
            btnStyle = "bg-slate-50 border-2 border-slate-200 text-slate-400 opacity-50"; 
          }
        }
        choicesHtml += `
          <button ${state.isAnswered ? 'disabled' : ''} onclick="handleChoiceSubmit(${idx})" class="p-3 md:p-4 rounded-xl text-left transition-all duration-200 ${btnStyle}">
            <span class="text-sm md:text-base font-medium">${choiceText}</span>
          </button>
        `;
      });
      const inputAreaHtml = `<div class="grid grid-cols-1 md:grid-cols-2 gap-2 md:gap-3">${choicesHtml}</div>`;

      let feedbackHtml = '';
      if (state.isAnswered) {
        const resultIcon = state.isCorrect 
          ? `<div class="flex items-center text-green-600"><i data-lucide="check-circle-2" class="w-6 h-6 mr-2"></i><span class="text-lg font-bold">正解！</span></div>`
          : `<div class="flex items-center text-red-600"><i data-lucide="x-circle" class="w-6 h-6 mr-2"></i><span class="text-lg font-bold">不正解...</span></div>`;

        const btnText = (state.currentIndex + 1 < state.questions.length) ? '次の問題へ' : '結果を見る';

        feedbackHtml = `
          <div class="mt-4 slide-in">
            <div class="p-4 md:p-5 rounded-2xl border ${state.isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}">
              <div class="flex items-center justify-between mb-3">
                ${resultIcon}
              </div>

              <!-- 丁寧なポイント解説 (グループ共通) -->
              <div class="bg-white rounded-xl p-3 md:p-4 border border-blue-100 shadow-sm mb-4">
                <div class="flex items-center space-x-2 mb-2">
                  <div class="p-1 md:p-1.5 bg-blue-100 text-blue-700 rounded-md"><i data-lucide="lightbulb" class="w-4 h-4 md:w-5 md:h-5"></i></div>
                  <h4 class="text-sm md:text-base font-bold text-blue-800">${concept.title}</h4>
                </div>
                <p class="text-xs md:text-sm text-slate-700 leading-relaxed font-medium">${concept.e}</p>
              </div>

              <!-- 個別解説 -->
              <div class="px-2 py-2 border-l-4 border-slate-300 mb-4 bg-slate-50 rounded-r-lg">
                <span class="text-xs text-slate-500 font-bold mb-1 block">【この問題の解説】</span>
                <p class="text-xs md:text-sm text-slate-700 whitespace-pre-line leading-relaxed">${currentQ.e}</p>
              </div>

              <!-- 作問者の意図 -->
              <div class="flex items-start space-x-2 px-2 mt-2">
                <i data-lucide="brain-circuit" class="w-4 h-4 text-orange-500 mt-0.5 shrink-0"></i>
                <div>
                  <h4 class="text-xs font-bold text-orange-700 mb-0.5">作問者の意図</h4>
                  <p class="text-xs text-slate-600 leading-relaxed">${currentQ.m}</p>
                </div>
              </div>

              <div class="mt-5 flex justify-end">
                <button onclick="goNext()" class="flex items-center px-6 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl shadow-md transition-transform transform hover:translate-x-1">
                  ${btnText}
                  <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }

      return `
        <div class="flex flex-col h-full p-2 md:p-4 max-w-4xl mx-auto w-full fade-in">
          <div class="flex items-center justify-between mb-3 text-xs md:text-sm font-medium text-slate-500 bg-white p-3 rounded-xl shadow-sm border border-slate-100">
            <div class="flex items-center space-x-3 md:space-x-4">
              <button onclick="goToMenu()" class="flex items-center text-slate-400 hover:text-slate-600 transition-colors" title="メニューへ戻る">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i> 中断
              </button>
              <span class="flex items-center pl-3 md:pl-4 border-l border-slate-200"><i data-lucide="book-open" class="w-4 h-4 mr-1 md:mr-2 text-blue-500"></i> ${currentQ.s}</span>
            </div>
            <span>Question ${state.currentIndex + 1} / ${state.questions.length}</span>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-6 mb-4 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
            <div class="mb-3">
              <span class="inline-block px-2 py-1 bg-blue-50 border border-blue-200 text-blue-700 text-xs font-bold rounded-lg shadow-sm">
                ${typeLabel}
              </span>
            </div>
            <p class="text-base md:text-xl font-medium text-slate-800 leading-relaxed whitespace-pre-line">${currentQ.q}</p>
          </div>

          <div class="flex-grow">
            ${inputAreaHtml}
          </div>

          ${feedbackHtml}
        </div>
      `;
    }

    function renderResultHtml() {
      const accuracy = Math.round((state.score / state.questions.length) * 100) || 0;
      const strokeColor = accuracy >= 80 ? '#22c55e' : accuracy >= 60 ? '#f59e0b' : '#ef4444';
      const circumference = 2 * Math.PI * 45;
      const offset = circumference * (1 - accuracy / 100);

      let mistakesBtnHtml = '';
      if (state.mistakes.length > 0) {
        mistakesBtnHtml = `
          <button onclick="startQuiz('mistakes')" class="flex-1 flex items-center justify-center py-3 md:py-4 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl shadow-md transition-colors text-sm md:text-base">
            <i data-lucide="refresh-cw" class="w-4 h-4 md:w-5 md:h-5 mr-2"></i> 間違えた問題
          </button>
        `;
      }

      return `
        <div class="flex flex-col items-center justify-center h-full p-4 md:p-8 space-y-6 md:space-y-8 fade-in mt-6 md:mt-12">
          <div class="text-center space-y-2">
            <h2 class="text-2xl md:text-3xl font-bold text-slate-800">学習完了！</h2>
            <p class="text-sm md:text-base text-slate-500">今回のスコア</p>
          </div>

          <div class="relative flex items-center justify-center w-40 h-40 md:w-48 md:h-48 bg-white rounded-full shadow-xl border-4 border-slate-50">
            <svg class="absolute w-full h-full transform -rotate-90" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="45" fill="none" stroke="#e2e8f0" stroke-width="8" />
              <circle cx="50" cy="50" r="45" fill="none" stroke="${strokeColor}" stroke-width="8" 
                stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" 
                class="transition-all duration-1000 ease-out" />
            </svg>
            <div class="text-center">
              <span class="text-4xl md:text-5xl font-black text-slate-800">${accuracy}</span>
              <span class="text-lg md:text-xl font-bold text-slate-400">%</span>
              <div class="text-xs md:text-sm font-medium text-slate-500 mt-1">${state.score} / ${state.questions.length} 正解</div>
            </div>
          </div>

          <div class="flex space-x-3 md:space-x-4 pt-4 md:pt-8 w-full max-w-md">
            <button onclick="goToMenu()" class="flex-1 flex items-center justify-center py-3 md:py-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-colors text-sm md:text-base">
              <i data-lucide="list-checks" class="w-4 h-4 md:w-5 md:h-5 mr-2"></i> メニュー
            </button>
            ${mistakesBtnHtml}
          </div>
        </div>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      let html = '';
      if (state.currentMode === 'menu') html = renderMenuHtml();
      else if (state.currentMode === 'quiz') html = renderQuizHtml();
      else if (state.currentMode === 'result') html = renderResultHtml();

      app.innerHTML = html;
      if (window.lucide) window.lucide.createIcons();
    }

    document.addEventListener("DOMContentLoaded", render);
  </script>
</body>
</html>
